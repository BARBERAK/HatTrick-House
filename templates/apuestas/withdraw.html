{% extends 'base.html' %}
{% load static %}
{% block title %}HatTrick House - Retirar{% endblock %}

{% block content %}
<style>
  .deposit-wrap {
    padding: 40px 0 60px;
    max-width: 480px;
    margin: 0 auto;
  }

  .deposit-card {
    background: #fff;
    border: 2px solid #e0e8ff;
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: 0 4px 20px rgba(0, 90, 255, 0.08);
  }

  .deposit-card h2 {
    font-size: 22px;
    font-weight: 700;
    color: #111;
    margin: 0 0 28px;
    letter-spacing: -0.3px;
  }

  /* ── BOTONES RÁPIDOS ── */
  .fast-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }

  .definied-button {
    background: #f0f4ff;
    border: 2px solid #c5d5ff;
    border-radius: 10px;
    color: #007BFF;
    font-size: 15px;
    font-weight: 700;
    padding: 12px 0;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }

  .definied-button:hover,
  .definied-button.active {
    background: #007BFF;
    border-color: #007BFF;
    color: #fff;
  }

  .definied-button:active { transform: scale(0.97); }

  /* ── DIVISOR ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .divider span {
    font-size: 12px;
    color: #aab4cc;
    white-space: nowrap;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e0e8ff;
  }

  /* ── INPUT ── */
  .input-wrap {
    position: relative;
    margin-bottom: 16px;
  }

  .currency-symbol {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    font-weight: 700;
    color: #aab4cc;
    pointer-events: none;
  }

  .amount-to-enter {
    width: 100%;
    box-sizing: border-box;
    border: 2px solid #e0e8ff;
    border-radius: 10px;
    padding: 14px 16px 14px 32px;
    font-size: 16px;
    font-family: inherit;
    font-weight: 600;
    color: #111;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .amount-to-enter:focus {
    border-color: #007BFF;
    box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1);
  }

  .amount-to-enter::placeholder {
    color: #aab4cc;
    font-weight: 400;
  }

  /* ── BOTÓN RETIRAR ── */
  .deposit-button {
    width: 100%;
    background: linear-gradient(90deg, #007BFF, #0056d2);
    border: none;
    border-radius: 40px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    padding: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.2s, transform 0.1s;
  }

  .deposit-button:hover {
    opacity: 0.88;
    transform: scale(1.02);
  }

  .deposit-button:active { transform: scale(0.98); }
</style>

<div class="deposit-wrap">
  <div class="deposit-card">
    <h2>🏧 Retirar Fondos</h2>

    <div class="fast-buttons">
      <button type="button" class="definied-button" data-valor="10">10€</button>
      <button type="button" class="definied-button" data-valor="20">20€</button>
      <button type="button" class="definied-button" data-valor="50">50€</button>
      <button type="button" class="definied-button" data-valor="100">100€</button>
    </div>

    <div class="divider"><span>o introduce una cantidad</span></div>

    <form method="post" class="deposit-form">
      {% csrf_token %}
      <div class="input-wrap">
        <span class="currency-symbol">€</span>
        <input type="number" id="input-quantity" name="quantity"
          step="0.01" min="0.01"
          placeholder="Cantidad a retirar"
          class="amount-to-enter" required>
      </div>
      <button type="submit" class="deposit-button">Retirar</button>
    </form>

  </div>
</div>

<script>
  const fastButtons = document.querySelectorAll('.definied-button');
  const textSpace = document.getElementById('input-quantity');

  fastButtons.forEach(button => {
    button.addEventListener('click', function () {
      textSpace.value = this.getAttribute('data-valor');
      fastButtons.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
    });
  });
</script>

{% endblock %}
