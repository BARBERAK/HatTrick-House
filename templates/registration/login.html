{% extends 'base.html' %}
{% block title %}Iniciar Sesión - HatTrick House{% endblock %}

{% block content %}
<style>
  .login-container {
    max-width: 460px;
    margin: 80px auto;
    padding: 45px 50px;
    background: linear-gradient(135deg, #ffffff, #f0f4ff);
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 90, 255, 0.12);
    border-top: 5px solid #007BFF;
  }

  .login-container h2 {
    text-align: center;
    margin-bottom: 28px;
    font-size: 30px;
    font-weight: 700;
    color: #007BFF;
    letter-spacing: 0.5px;
  }

  .login-container label {
    font-weight: 600;
    font-size: 13px;
    color: #444;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .login-container input[type="text"],
  .login-container input[type="password"] {
    width: 100%;
    padding: 11px 14px;
    margin-top: 5px;
    margin-bottom: 18px;
    border: 1.5px solid #c5d5ff;
    border-radius: 8px;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    background-color: #f7f9ff;
    color: #222;
    box-sizing: border-box;
    transition: border-color 0.2s;
  }

  .login-container input[type="text"]:focus,
  .login-container input[type="password"]:focus {
    outline: none;
    border-color: #007BFF;
    background-color: #fff;
  }

  .login-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(90deg, #007BFF, #0056d2);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Poppins', sans-serif;
    letter-spacing: 0.5px;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s, transform 0.1s;
  }

  .login-btn:hover {
    opacity: 0.92;
    transform: translateY(-1px);
  }

  .login-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: #888;
  }

  .login-footer a {
    color: #007BFF;
    font-weight: 600;
    text-decoration: none;
  }

  .login-footer a:hover {
    text-decoration: underline;
  }
</style>

<div class="login-container">
  <h2>⚽ Iniciar Sesión</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="login-btn">Entrar</button>
  </form>
  <div class="login-footer">
    ¿No tienes cuenta? <a href="{% url 'apuestas:registrar' %}">Regístrate aquí</a>
  </div>
</div>

{% endblock %}
